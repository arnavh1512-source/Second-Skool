# Nightly database backup.
#
# The Supabase free plan takes no backups at all — no snapshots, no PITR, no
# export button. This database holds student names, home addresses and parents'
# phone numbers, so "no backups" is not a posture we can keep. This workflow is
# the free-tier substitute: a nightly pg_dump stored as a private GitHub
# artifact.
#
# SETUP — one secret, then this runs on its own:
#   Supabase Dashboard > Connect > Direct > Session pooler > copy the URI
#   GitHub > Settings > Secrets and variables > Actions > New repository secret
#     Name:  SUPABASE_DB_URL
#     Value: postgresql://postgres.<ref>:<password>@aws-...pooler.supabase.com:5432/postgres
#
#   It must be the SESSION pooler (port 5432), not the transaction pooler
#   (6543) — pg_dump needs a session, and the transaction pooler will not give
#   it one. Direct connections are IPv6-only and GitHub runners are IPv4, so
#   the pooler is the only route that works from here.
#
#   The password must not contain characters that need percent-encoding in a
#   URI (@ / : ? # %). Use a long alphanumeric one and that whole class of
#   confusing auth failures goes away.
#
# OPTIONAL — add a BACKUP_PASSPHRASE secret and the dumps are encrypted at
# rest with GPG. Without it they are plain gzip, which is acceptable only
# because this repo is private. If the repo is ever made public, artifacts
# become world-readable and this secret stops being optional.
#
# WHY A CONTAINER: pg_dump refuses to dump a server newer than itself, and
# this database is Postgres 17 while the runner image ships an older client.
# The first version of this workflow added the PGDG apt repository to get the
# pg17 client — three commands that each assume the runner image has not
# already done something similar, and it failed on the first real run. The
# official postgres image already contains exactly the client we need, so the
# whole problem is better deleted than debugged.
#
# WHY `set -eu` AND NOT `set -euo pipefail`: the runner does not find a
# bash inside this container and falls back to `sh -e {0}`, which is dash.
# dash has no `pipefail` and exits 2 on the attempt, killing the step on its
# very first line. Nothing here pipes anything, so pipefail was never
# earning its keep. Keep every script in this file POSIX sh.
#
# Restoring is documented in supabase/BACKUP.md. A backup nobody has tried to
# restore is a guess, not a backup — do the drill once.

name: Database backup

on:
  schedule:
    # 20:00 UTC = 01:30 IST, well clear of tuition hours.
    - cron: '0 20 * * *'
  workflow_dispatch:

# Never let two dumps overlap.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    # Debian-based on purpose. The alpine variant is musl, and GitHub's
    # JavaScript actions (upload-artifact) want glibc.
    container: postgres:17-bookworm
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check the toolchain and the secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -eu
          pg_dump --version
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it under Settings > Secrets and variables > Actions as a repository *secret*, not a variable."
            exit 1
          fi
          # Catch the two connection strings that look right and are not,
          # before pg_dump spends the timeout finding out the hard way.
          case "$SUPABASE_DB_URL" in
            *:6543/*)
              echo "::error::That is the transaction pooler (port 6543). pg_dump needs a session — use the Session pooler on port 5432."
              exit 1 ;;
            *db.*.supabase.co*)
              echo "::error::That is the direct connection, which is IPv6-only. GitHub runners are IPv4 — use the Session pooler (host ends in pooler.supabase.com)."
              exit 1 ;;
          esac
          # The pooler multiplexes every project on one host, so it needs the
          # tenant in the username. Plain `postgres` gets you a bare
          # "password authentication failed" that reads like a wrong password.
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*)
              case "$SUPABASE_DB_URL" in
                postgresql://postgres.*) : ;;
                *)
                  echo "::error::The pooler needs the tenant-qualified user 'postgres.<project-ref>', not plain 'postgres'. Re-copy the Session pooler URI rather than editing the direct one by hand."
                  exit 1 ;;
              esac ;;
          esac

      - name: Dump application data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -eu
          mkdir -p out
          # Schema plus data for everything the app owns. No --clean: a file
          # full of DROP statements is a loaded gun sitting in an artifact.
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner --no-privileges \
            --file=out/public.sql

      - name: Dump auth users
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -eu
          # Data only. A fresh Supabase project builds the auth schema itself,
          # so the structure is never what you want to restore — the rows are.
          pg_dump "$SUPABASE_DB_URL" \
            --data-only \
            --table=auth.users \
            --table=auth.identities \
            --no-owner --no-privileges \
            --file=out/auth-users.sql

      # A dump that silently produced nothing is worse than no dump, because it
      # looks like success on the runs page for months.
      - name: Verify the dumps are real
        run: |
          set -eu
          for f in out/public.sql out/auth-users.sql; do
            size=$(stat -c%s "$f")
            echo "$f — $size bytes"
            if [ "$size" -lt 1000 ]; then
              echo "::error::$f is only $size bytes. Treating this as a failed backup."
              exit 1
            fi
          done
          grep -q 'CREATE TABLE public.students' out/public.sql || {
            echo "::error::public.sql has no students table. The dump is incomplete."; exit 1; }

      - name: Compress and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -eu
          gzip out/public.sql out/auth-users.sql
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            command -v gpg >/dev/null || { apt-get update -qq && apt-get install -y -qq gnupg; }
            for f in out/*.gz; do
              gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$BACKUP_PASSPHRASE" "$f"
              rm "$f"
            done
            echo "Encrypted with AES256. Decrypt with: gpg --decrypt <file>.gpg > <file>"
          else
            echo "::warning::BACKUP_PASSPHRASE is not set — dumps are stored as plain gzip. Safe only while this repository stays private."
          fi
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: error
